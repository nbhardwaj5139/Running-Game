<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>VITREOUS — prototype</title>
<style>
  :root { color-scheme: dark; --amber: #ffb347; --red: #ff3b4e; --cyan: #7ef0ff; }
  html, body { margin: 0; height: 100%; background: #12040a; overflow: hidden; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #f4e7e0; -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .top { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .stat { font-size: 13px; opacity: .85; letter-spacing: .06em; text-transform: uppercase; }
  .stat b { display: block; font-size: 28px; letter-spacing: 0; line-height: 1; color: #fff; text-shadow: 0 0 12px rgba(255,179,71,.6); }
  .bars { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 16px; right: 16px; display: grid; gap: 8px; }
  .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0; width: 0%; transition: width .12s linear; border-radius: 4px; }
  #nerve i { background: linear-gradient(90deg, #3ab8c9, var(--cyan)); box-shadow: 0 0 10px var(--cyan); }
  #blink i { background: linear-gradient(90deg, #7a1420, var(--red)); box-shadow: 0 0 10px var(--red); }
  .bar label { position: absolute; right: 0; top: -16px; font-size: 11px; letter-spacing: .1em; opacity: .7; }
  #nerve.ready i { animation: pulse .8s ease-in-out infinite alternate; }
  @keyframes pulse { from { filter: brightness(1) } to { filter: brightness(1.6) } }
  #vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 #000; transition: box-shadow .2s; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at var(--fx, 50%) 50%, rgba(255,220,170,.55), transparent 55%); transition: opacity .25s; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  #msg .card { background: rgba(18,4,10,.72); border: 1px solid rgba(255,179,71,.25); padding: 22px 28px; border-radius: 14px; backdrop-filter: blur(6px); max-width: min(520px, 90vw); }
  #msg h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: .18em; color: var(--amber); font-weight: 600; }
  #msg p { margin: 6px 0; font-size: 14px; line-height: 1.5; opacity: .9; }
  #msg .keys { font-size: 12px; opacity: .65; margin-top: 10px; }
  #msg kbd { border: 1px solid rgba(255,255,255,.25); border-radius: 4px; padding: 1px 6px; font-family: inherit; }
  #msg.hidden { display: none; }
  #room { font-size: 12px; opacity: .75; text-align: right; }
  #room .p { color: var(--cyan); }
  #tele { position: absolute; top: 0; bottom: 0; width: 18%; pointer-events: none; opacity: 0; transition: opacity .1s; }
  #tele.left { left: 0; background: linear-gradient(90deg, rgba(255,179,71,.55), transparent); }
  #tele.right { right: 0; background: linear-gradient(270deg, rgba(255,179,71,.55), transparent); }
  #tele.on { opacity: 1; }
  .hint { position: absolute; bottom: 46px; left: 0; right: 0; text-align: center; font-size: 11px; opacity: .45; letter-spacing: .12em; }
  @media (max-width: 640px) { .stat b { font-size: 22px } #msg h1 { font-size: 24px } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="stat">distance<b id="dist">0 m</b></div>
    <div class="stat" style="text-align:center">score<b id="score">0</b></div>
    <div class="stat" style="text-align:right">photons<b id="photons">0</b><div id="room"></div></div>
  </div>
  <div id="tele"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div class="hint" id="hint"></div>
  <div class="bars">
    <div class="bar" id="nerve"><label>NERVE</label><i></i></div>
    <div class="bar" id="blink"><label>THE BLINK</label><i></i></div>
  </div>
  <div id="msg">
    <div class="card">
      <h1>VITREOUS</h1>
      <p id="msgBody">Something enormous is asleep. You live in its eye.<br>Run toward the light. Don't let it blink.</p>
      <p class="keys"><kbd>←</kbd><kbd>→</kbd> lane &nbsp; <kbd>↑</kbd>/<kbd>space</kbd> jump (hold for height) &nbsp; <kbd>↓</kbd> slide / fast-fall<br><kbd>Q</kbd>/<kbd>E</kbd> spend Nerve → saccade left / right &nbsp; <kbd>R</kbd> restart &nbsp; swipe on touch</p>
      <p class="keys" id="msgFoot">press any key or tap to run</p>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
